name: Deploy to EC2 (Port 5173)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Run on EC2 (Port 5173)
    runs-on: [self-hosted, ec2-runner]

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Step 3: Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build production assets
      - name: Build Production Assets
        run: npm run build

      # Step 5: Deploy to /var/www/myapp and run as a permanent systemd background service
      - name: Deploy & Start Service on Port 5173
        run: |
          DEPLOY_DIR="/var/www/myapp"
          echo "🚀 Deploying static files to ${DEPLOY_DIR}..."

          # 1. Create permanent directory
          sudo mkdir -p ${DEPLOY_DIR}

          # 2. Copy production assets
          sudo rm -rf ${DEPLOY_DIR}/*
          sudo cp -r dist/* ${DEPLOY_DIR}/
          sudo chown -R $USER:$USER ${DEPLOY_DIR}
          sudo chmod -R 755 ${DEPLOY_DIR}

          # 3. Ensure 'serve' static server is installed globally
          sudo npm install -g serve

          # 4. Create systemd service (so GitHub Actions runner cannot kill the background process)
          echo "⚙️ Configuring systemd service 'myapp.service'..."
          sudo bash -c "cat <<'EOF' > /etc/systemd/system/myapp.service
          [Unit]
          Description=Lumina Library Management Static Server
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/var/www/myapp
          ExecStart=/usr/bin/env npx serve -s /var/www/myapp -l 5173
          Restart=always
          RestartSec=3
          Environment=PATH=/usr/local/bin:/usr/bin:/bin:$PATH

          [Install]
          WantedBy=multi-user.target
          EOF"

          # 5. Reload systemd daemon, enable on boot, and start the service
          sudo systemctl daemon-reload
          sudo systemctl enable myapp
          sudo systemctl restart myapp

          # 6. Verification: Check service status and port listener
          sleep 2
          echo "📋 Service Status:"
          sudo systemctl status myapp --no-pager

          echo "🔍 Checking port 5173 listener:"
          sudo ss -tulpn | grep 5173 || sudo lsof -i :5173

          echo "🌐 Testing local HTTP response:"
          curl -I http://127.0.0.1:5173

          echo "✅ Lumina Library Management is running on port 5173!"
