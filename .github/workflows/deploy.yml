name: Deploy Docker to EC2 (Port 5173)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Docker Container on EC2
    runs-on: [self-hosted, ec2-runner]

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Stop old systemd service if present (to avoid port 5173 conflict)
      - name: Stop Old Systemd Service (if exists)
        run: |
          sudo systemctl stop myapp 2>/dev/null || true
          sudo systemctl disable myapp 2>/dev/null || true

      # Step 3: Build Docker Image
      - name: Build Docker Image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t library-app:latest .

      # Step 4: Run Docker Container on Port 5173
      - name: Run Container on Port 5173
        run: |
          echo "🛑 Stopping existing container if running..."
          docker stop library-app 2>/dev/null || true
          docker rm library-app 2>/dev/null || true

          echo "🚀 Starting new container on port 5173..."
          docker run -d \
            --name library-app \
            --restart unless-stopped \
            -p 5173:5173 \
            library-app:latest

      # Step 5: Clean up dangling images to save EC2 disk space
      - name: Prune Dangling Images
        run: |
          docker image prune -f

      # Step 6: Verify deployment
      - name: Verify Container & HTTP Health
        run: |
          sleep 5
          echo "📋 Running Containers:"
          docker ps -f name=library-app

          echo "🌐 Testing HTTP Response:"
          curl -I --retry 3 --retry-delay 2 http://127.0.0.1:5173 || exit 1

          echo "✅ Application successfully deployed with Docker on port 5173!"
