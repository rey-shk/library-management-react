name: Deploy to EC2 (Port 5173)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Run on EC2 (Port 5173)
    runs-on: [self-hosted, ec2-runner]

    steps:
      # Step 1: Checkout repository code on the EC2 runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js runtime
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build production assets (TypeScript check & Vite build)
      - name: Build Production Assets
        run: npm run build

      # Step 5: Start / Restart the application on Port 5173 using PM2
      - name: Deploy & Start on Port 5173
        run: |
          echo "🚀 Starting static production server on port 5173..."

          # Ensure PM2 process manager is installed
          command -v pm2 >/dev/null 2>&1 || npm install -g pm2

          # Remove previous process instance if running
          pm2 delete myapp 2>/dev/null || true

          # Serve the production 'dist' directory on port 5173 with SPA routing support
          pm2 serve dist 5173 --name "myapp" --spa

          # Save PM2 state so the server automatically restarts if EC2 reboots
          pm2 save

          echo "✅ Lumina Library Management is running on port 5173!"
